_schema-version: 3.3.0
ID: User_Access_Shield_Tool
description: A simple CAP project.
version: 1.0.0
modules:
- name: User_Access_Shield_Tool-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: User_Access_Shield_Tool-auth
  - name: User_Access_Shield_Tool-connectivity
  - name: User_Access_Shield_Tool-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm
- name: User_Access_Shield_Tool
  type: approuter.nodejs
  path: app/router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: User_Access_Shield_Tool-auth
  - name: User_Access_Shield_Tool-destination
  - name: User_Access_Shield_Tool-html5-runtime
  provides:
  - name: app-api
    properties:
      app-protocol: ${protocol}
      app-uri: ${default-uri}
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M
- name: User_Access_Shield_Tool-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: User_Access_Shield_Tool-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - home.zip
      name: User_Access_Shield_Toolhome
      target-path: app/
    - artifacts:
      - diligentcomuashome.zip
      name: diligentcomuashome
      target-path: app//
- name: User_Access_Shield_Toolhome
  type: html5
  path: app/home
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm ci
    - npm run build
    supported-platforms: []
- name: diligentcomuashome
  type: html5
  path: app/home
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: User_Access_Shield_Tool-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: User_Access_Shield_Tool-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: User_Access_Shield_Tool-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: User_Access_Shield_Tool-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
- name: User_Access_Shield_Tool-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: User_Access_Shield_Tool-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
